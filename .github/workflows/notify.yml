name: Daily push notification

on:
  schedule:
    # 08:50 UTC = 11:50 МСК. Некруглая минута + запас: очередь GitHub опаздывает
    # на 10–40 минут, так что пуш реально приходит около полудня.
    - cron: '50 8 * * *'
  workflow_dispatch:       # Ручной запуск для теста

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pywebpush

      - name: Send push
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python notify.py

      - name: Commit cleaned subscriptions
        run: |
          git config --global user.name "YulechkaBot"
          git config --global user.email "bot@github.com"
          git add subscriptions.json
          git diff --cached --quiet || (git commit -m "Push: вычищены умершие подписки" && git push)
