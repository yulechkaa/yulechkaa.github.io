name: Daily Yulechka Rhyme Generator

on:
  schedule:
    # Некруглая минута: слот «0 0» — самый перегруженный у GitHub, очередь
    # опаздывала на 3+ часа. 00:52 UTC = 03:52 МСК, открытка готова к утру.
    - cron: '52 0 * * *'
  workflow_dispatch:
    inputs:
      art_mode:
        description: 'Режим арта для этого запуска'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - video
          - image
          - scene
          - svg

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow edge-tts

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Run script
      id: generate
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # Claude Sonnet 5 (основной); без ключа — Gemini
        VERSE_PROVIDER: ${{ vars.VERSE_PROVIDER || 'gemini' }}  # gemini / openrouter / auto
        ART_MODE: ${{ inputs.art_mode || vars.ART_MODE || 'auto' }} # ручной выбор → переменная → auto
        IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'google/gemini-3.1-flash-image' }}
      run: python generate.py

    - name: Publish source frame for video generation
      if: steps.generate.outputs.art_mode == 'video'
      id: publish-frame
      run: |
        git config user.name "YulechkaBot"
        git config user.email "bot@github.com"
        git add art data.json history.json archive.json
        git diff --cached --quiet || git commit -m "Automation: publish video source frame"
        git push
        echo "frame_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Generate subtle Seedance video background
      if: steps.generate.outputs.art_mode == 'video'
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        VIDEO_MODEL: ${{ vars.VIDEO_MODEL || 'bytedance/seedance-1-5-pro' }}
        VIDEO_FRAME_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.publish-frame.outputs.frame_ref }}/
      run: python generate_card_video.py

    - name: Install voice deps
      run: |
        pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        pip install chatterbox-tts soundfile ruaccent

    - name: Voice (твой голос)
      run: python voice.py

    - name: Commit and push changes
      run: |
        git config --global user.name "YulechkaBot"
        git config --global user.email "bot@github.com"
        git add -A
        git diff --cached --quiet || git commit -m "Automation: new daily rhyme generated"
        git push
