name: Daily Yulechka Rhyme Generator

on:
  schedule:
    # Некруглая минута: слот «0 0» — самый перегруженный у GitHub, очередь
    # опаздывала на 3+ часа. 00:52 UTC = 03:52 МСК, открытка готова к утру.
    - cron: '52 0 * * *'
  workflow_dispatch:     # Ручной запуск кнопкой для теста

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow edge-tts

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # Claude Sonnet 5 (основной); без ключа — Gemini
        VERSE_PROVIDER: ${{ vars.VERSE_PROVIDER || 'gemini' }}  # gemini / openrouter / auto
        ART_MODE: ${{ vars.ART_MODE || 'auto' }}                # auto / svg / scene / image
        IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'google/gemini-3.1-flash-image' }}
      run: python generate.py

    - name: Install voice deps
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        pip install chatterbox-tts soundfile ruaccent

    - name: Voice (твой голос)
      run: python voice.py

    - name: Commit and push changes
      run: |
        git config --global user.name "YulechkaBot"
        git config --global user.email "bot@github.com"
        git add -A
        git diff --cached --quiet || git commit -m "Automation: new daily rhyme generated"
        git push
