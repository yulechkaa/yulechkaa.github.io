name: Daily Yulechka Rhyme Generator

on:
  schedule:
    - cron: '0 0 * * *' # Каждую ночь в 00:00 UTC (~03:00 МСК)
  workflow_dispatch:     # Ручной запуск кнопкой для теста

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests edge-tts

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python generate.py

    - name: Install voice deps
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install chatterbox-tts torch torchaudio soundfile 

    - name: Voice (твой голос)
      run: python voice.py

    - name: Commit and push changes
      run: |
        git config --global user.name "YulechkaBot"
        git config --global user.email "bot@github.com"
        git add -A
        git diff --cached --quiet || git commit -m "Automation: new daily rhyme generated"
        git push

