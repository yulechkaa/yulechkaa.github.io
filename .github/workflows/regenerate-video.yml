name: Regenerate today's video background

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests
        sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Regenerate video from today's published image
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        VIDEO_MODEL: ${{ vars.VIDEO_MODEL || 'bytedance/seedance-1-5-pro' }}
        VIDEO_FRAME_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/
      run: python generate_card_video.py

    - name: Commit generated video
      run: |
        git config user.name "YulechkaBot"
        git config user.email "bot@github.com"
        git add art data.json archive.json
        git diff --cached --quiet || git commit -m "Automation: refine today's video background"
        git push
