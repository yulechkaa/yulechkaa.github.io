<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Юлечки</title>

    <!-- Базовые премиум-шрифты (с кириллицей). Шрифт слова на день подгружается из JS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <!-- PWA: установка на экран телефона -->
    <meta name="theme-color" content="#f4e9e3">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Юлечке">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="image-backdrop" aria-hidden="true">
        <img id="image-bg" alt="" decoding="async">
        <video id="video-bg" muted loop autoplay playsinline preload="metadata" aria-hidden="true"></video>
        <i class="image-light a"></i><i class="image-light b"></i>
    </div>
    <div id="art" aria-hidden="true"></div>
    <iframe id="scene" aria-hidden="true" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
    <main class="card">
        <h1 class="name">Юлечка —</h1>
        <div class="rule"></div>
        <p class="rhyme" id="rhyme">…</p>
        <details class="poem" id="poem"><summary>Прочитать стих</summary><p id="poem-text"></p></details>
    </main>
    <div class="date" id="date" hidden></div>
    <button id="play" class="play" type="button" aria-label="Послушать" hidden>
        <svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle id="play-ring" cx="28" cy="28" r="26.5"/></svg>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="bell" class="bell" type="button" aria-label="Включить уведомления" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
    </button>
    <button id="nav-prev" class="nav nav-prev" type="button" aria-label="Прошлый день" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="nav-next" class="nav nav-next" type="button" aria-label="Следующий день" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div id="install" class="install" role="button" tabindex="0" hidden>
        <span id="install-text">Добавить на экран телефона</span>
        <button id="install-close" class="install-x" type="button" aria-label="Скрыть">×</button>
    </div>
    <div id="share-hint" class="install" role="button" tabindex="0" hidden>
        <span>Уведомления включены! Нажми, чтобы отправить код&nbsp;💌</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
