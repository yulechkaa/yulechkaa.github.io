<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Юлечки</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 1s ease;
            cursor: pointer;
            user-select: none;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 800;
        }
        .rhyme {
            font-size: 4rem;
            color: #e74c3c;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .hint {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #7f8c8d;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Юлечка-</h1>
        <div class="rhyme" id="rhyme">...</div>
        <div class="hint">Нажми на экран, чтобы послушать</div>
    </div>

    <script>
        // Простая функция хэширования строки в уникальный пастельный цвет
        function generateColors(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            document.body.style.background = `radial-gradient(circle, hsl(${hue}, 85%, 93%) 0%, hsl(${hue}, 70%, 85%) 100%)`;
        }

        // Загрузка данных дня
        async function init() {
            try {
                // Избегаем кэширования браузером с помощью таймстемпа
                const res = await fetch(`data.json?t=${Date.now()}`);
                const data = await res.json();
                
                const rhymeWord = data.rhyme;
                document.getElementById('rhyme').innerText = rhymeWord;
                generateColors(rhymeWord);
            } catch (e) {
                document.getElementById('rhyme').innerText = "красотулечка";
                generateColors("красотулечка");
            }
        }

        // Воспроизведение аудио при клике
        const audio = new Audio(`audio.mp3?t=${Date.now()}`);
        document.body.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play().catch(err => console.log("Ожидание взаимодействия пользователя"));
        });

        init();
    </script>
</body>
</html>
