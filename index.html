<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Юлечки</title>

    <!-- Премиум-шрифты с поддержкой кириллицы -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Палитра подменяется из JS под рифму дня */
            --hue: 28;
            --ink: hsl(var(--hue), 24%, 22%);
            --ink-soft: hsl(var(--hue), 14%, 46%);
            --accent: hsl(var(--hue), 46%, 40%);
            --bg-1: hsl(var(--hue), 38%, 96%);
            --bg-2: hsl(var(--hue), 30%, 90%);
            --line: hsl(var(--hue), 22%, 80%);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(24px, 6vw, 80px);
            font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            text-align: center;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            background:
                radial-gradient(120% 120% at 50% 0%, var(--bg-1) 0%, var(--bg-2) 70%, var(--bg-2) 100%);
            transition: --hue 1.2s ease;
            overflow: hidden;
        }

        /* Тонкое зерно/виньетка для глубины */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(140% 100% at 50% 40%, transparent 55%, rgba(0,0,0,0.06) 100%);
        }

        .card {
            position: relative;
            max-width: 720px;
            width: 100%;
            opacity: 0;
            transform: translateY(14px);
            animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .eyebrow {
            font-size: clamp(0.7rem, 2.4vw, 0.82rem);
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 0 0 clamp(20px, 5vw, 34px);
            padding-left: 0.42em; /* компенсация трекинга */
        }

        .name {
            font-family: "Cormorant Garamond", serif;
            font-weight: 500;
            font-style: italic;
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            line-height: 1;
            color: var(--ink-soft);
            margin: 0;
        }

        /* Разделительная черта */
        .rule {
            width: clamp(40px, 12vw, 72px);
            height: 1px;
            margin: clamp(18px, 4vw, 28px) auto;
            background: var(--line);
        }

        .rhyme {
            font-family: "Cormorant Garamond", serif;
            font-weight: 500;
            font-size: clamp(3.4rem, 17vw, 7.5rem);
            line-height: 0.98;
            letter-spacing: -0.01em;
            color: var(--accent);
            margin: 0;
            word-break: break-word;
        }

        @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>

    <main class="card">
        <h1 class="name">Юлечка —</h1>
        <div class="rule"></div>
        <p class="rhyme" id="rhyme">…</p>
    </main>

    <script>
        // Уникальный благородный оттенок из строки рифмы
        function applyHue(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            document.documentElement.style.setProperty('--hue', hue);
        }

        function show(word) {
            document.getElementById('rhyme').textContent = word;
            applyHue(word);
        }

        async function init() {
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                const data = await res.json();
                show(data.rhyme);
            } catch (e) {
                show("красотулечка");
            }
        }

        init();
    </script>
</body>
</html>
